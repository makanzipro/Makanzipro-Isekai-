
name: Construire l'APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3

    steps:
      - uses: actions/checkout@v4

      - name: Préparer Java et Android
        run: |
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk

          mkdir -p ~/.config/godot
          mkdir -p ~/.local/share/godot/export_templates

          cp -a /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/

          echo "export/android/java_sdk_path = \"$JAVA_HOME\"" >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> ~/.config/godot/editor_settings-4.tres

          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          godot --headless --editor --path . --quit || true

          echo "export/android/debug_keystore = \"$HOME/debug.keystore\"" >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/editor_settings-4.tres

      - name: Importer le projet
        run: godot --headless --editor --path . --import

      - name: Exporter l'APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/MAKANZIPRO.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: MAKANZIPRO-APK
          path: build/*.apk
          
